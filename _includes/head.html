<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Libre+Baskerville:400,400i,700">
  {% feed_meta %}
  {% seo title=false %}
  <meta name="theme-color" content="#4a9ae1">
  {% if site.mastodon %}<meta name="fediverse:creator" content="{{ site.mastodon }}">{% endif %}
  {% for link in site.social.links %}<link rel="me" href="{{ link }}">
  {% endfor %}

</head>
